name: Bug report
description: Report a reproducible defect using sanitized evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include secrets/personal data here. Follow the current private pre-release lifecycle in SECURITY.md; the future public private-report form is not yet available.
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: The exact commit where the defect was reproduced.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend/Auth
        - Backend/TRP
        - Frontend
        - Docker/runtime
        - Documentation/tooling
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Ubuntu, Docker/Compose, Node.js, npm, browser, and PostgreSQL versions as relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps with synthetic data and no tokens, credentials, private keys, personal data, or protocol bearer URLs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, database dumps, request bodies/query values, Travel Addresses, JWTs, and private keys.
          required: true
        - label: This report is not a security vulnerability.
          required: true
